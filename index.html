<!DOCTYPE html>
<html lang="vi">
<head>
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-aOqHM8YbKMzpjNFE1uW4Im77RiGKZgq0/OGbTOpVqAI='; style-src 'sha256-mjS2UCkNJtH9EnW7jIHkkHYU7l4sgdMHHChcpG9FIvw='; connect-src https://translate.googleapis.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta charset="UTF-8">
  <title>Neural-Lingua Translator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #e9e1e5;
    }
    h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    .translator-wrapper {
      max-width: 1100px;
      margin: auto;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .side {
      flex: 1;
      min-width: 300px;
      max-width: 600px;
      display: flex;
      flex-direction: column;
    }
    select, button {
      padding: 10px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }
    .text-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 10px;
      background-color: white;
      position: relative;
    }
    textarea {
      width: 100%;
      height: 150px;
      font-size: 16px;
      padding: 10px;
      border: none;
      outline: none;
      resize: none;
      background-color: transparent;
    }
    .char-count {
      text-align: right;
      font-size: 12px;
      color: #888;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .switch-button {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .switch-button button {
      font-size: 28px;
      border: none;
      background: none;
      cursor: pointer;
      margin-top: 70px;
    }
    .translated-label {
      color: #5f6368;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h2>Neural-Lingua Translator</h2>
<p>Văn bản được gửi tới dịch vụ dịch bên ngoài khi bạn bấm Dịch. Tránh nhập thông tin riêng tư.</p>

<div class="translator-wrapper">

  <!-- Bên trái -->
  <div class="side">
    <select id="sourceLanguage">
      <option value="auto">Phát hiện ngôn ngữ</option>
      <option value="vi">Tiếng Việt</option>
      <option value="en">Tiếng Anh</option>
      <option value="fr">Tiếng Pháp</option>
      <option value="es">Tiếng Tây Ban Nha</option>
      <option value="ja">Tiếng Nhật</option>
      <option value="ko">Tiếng Hàn</option>
      <option value="zh">Tiếng Trung</option>
    </select>
    <div class="text-box">
      <textarea id="textInput" placeholder="Nhập nội dung cần dịch..." maxlength="5000"></textarea>
      <div class="char-count" id="charCount">0 / 5000</div>
      <div class="controls">
        <button id="recordButton">🎤 Ghi âm</button>
        <button id="translateButton">🔁 Dịch</button>
      </div>
    </div>
  </div>

  <!-- Nút đảo chiều -->
  <div class="switch-button">
    <button id="swapButton">⇄</button>
  </div>

  <!-- Bên phải -->
  <div class="side">
    <select id="targetLanguage">
      <option value="en">Tiếng Anh</option>
      <option value="vi">Tiếng Việt</option>
<option value="fr">Tiếng Pháp</option>
      <option value="es">Tiếng Tây Ban Nha</option>
      <option value="ja">Tiếng Nhật</option>
      <option value="ko">Tiếng Hàn</option>
      <option value="zh">Tiếng Trung</option>
    </select>
    <div class="text-box">
      <textarea id="translatedText" placeholder="Bản dịch..." readonly></textarea>
      <div class="translated-label">Bản dịch</div>
      <div class="controls">
        <button id="playButton">🔊 Nghe</button>
      </div>
    </div>
  </div>

</div>

<script>
  function updateCharCount() {
    const text = document.getElementById("textInput").value;
    document.getElementById("charCount").innerText = `${text.length} / 5000`;
  }

  function swapLanguages() {
    const source = document.getElementById("sourceLanguage");
    const target = document.getElementById("targetLanguage");
    const temp = source.value;
    source.value = target.value;
    target.value = temp === 'auto' ? (detectedLanguage || 'vi') : temp;

    const input = document.getElementById("textInput");
    const output = document.getElementById("translatedText");
    const tempText = input.value;
    input.value = output.value.slice(0, 5000);
    output.value = tempText;

    updateCharCount();
  }

  let detectedLanguage = 'vi';
  let activeRequest = null;
  let requestNumber = 0;
  async function translateText() {
    const number = ++requestNumber;
    if (activeRequest) activeRequest.abort();
    activeRequest = new AbortController();
    const controller = activeRequest;
    const timeout = setTimeout(() => controller.abort(), 15000);
    const text = document.getElementById("textInput").value.trim();
    const from = document.getElementById("sourceLanguage").value;
    const to = document.getElementById("targetLanguage").value;
    const output = document.getElementById("translatedText");

    if (!text || text.length > 5000) {
      clearTimeout(timeout);
      output.value = "Vui lòng nhập nội dung.";
      return;
    }

    output.value = "⏳ Đang dịch...";

    try {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
      const res = await fetch(url, {signal: controller.signal, credentials: 'omit', referrerPolicy: 'no-referrer'});
      if (!res.ok) throw new Error('Translation unavailable');
      const data = await res.json();
      if (number !== requestNumber) return;
      if (!Array.isArray(data[0])) throw new Error('Invalid response');
      detectedLanguage = ['vi','en','fr','es','ja','ko','zh'].includes(data[2]) ? data[2] : 'vi';
      output.value = data[0].filter(Array.isArray).map(segment => typeof segment[0] === 'string' ? segment[0] : '').join('');
    } catch (err) {
      if (number !== requestNumber) return;
      output.value = "⚠️ Không thể dịch. Kiểm tra mạng và thử lại.";
    } finally {
      clearTimeout(timeout);
    }
  }

  function playTranslation() {
    const text = document.getElementById("translatedText").value;
    const lang = document.getElementById("targetLanguage").value;

    if (!text) return;

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang;
    speechSynthesis.cancel();
    speechSynthesis.speak(utterance);
  }

  function startRecording() {
    if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
      alert("Trình duyệt không hỗ trợ ghi âm.");
      return;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    const source = document.getElementById('sourceLanguage').value;
    recognition.lang = source === 'auto' ? (detectedLanguage || 'vi') : source;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.start();

    recognition.onresult = function(event) {
      const transcript = event.results[0][0].transcript;
document.getElementById("textInput").value = transcript.slice(0, 5000);
      updateCharCount();
    };

    recognition.onerror = function(event) {
      alert("Lỗi ghi âm: " + event.error);
    };
  }

  document.getElementById('textInput').addEventListener('input', updateCharCount);
  document.getElementById('translateButton').addEventListener('click', translateText);
  document.getElementById('recordButton').addEventListener('click', startRecording);
  document.getElementById('swapButton').addEventListener('click', swapLanguages);
  document.getElementById('playButton').addEventListener('click', playTranslation);
  if ('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = () => {
    speechSynthesis.getVoices(); // load danh sách voice
  };
</script>

</body>
</html>
